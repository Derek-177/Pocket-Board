<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pocket Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Pocket Board</h1>
    <p class="intro">Type a note, press Add, and it sticks to the board. Notes stay saved in this browser.</p>

    <form id="note-form" autocomplete="off">
      <label for="note-input" class="visually-hidden">New note</label>
      <input id="note-input" type="text" maxlength="80" placeholder="Buy mangoes, call Ravi, water the plants…" required>
      <button type="submit" class="primary">Add note</button>
    </form>

    <div class="toolbar">
      <span id="count">0 notes</span>
      <button type="button" id="clear-done">Clear finished</button>
      <button type="button" id="clear-all">Clear all</button>
    </div>

    <ul id="board" aria-live="polite"></ul>
    <p id="empty">The board is empty. Add your first note above.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
